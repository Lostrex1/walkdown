name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check
      - run: npm run action:check
      - run: npm test
  action-dogfood:
    name: Action dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - name: Start fixture
        run: node fixtures/action-app/server.mjs > fixture.log 2>&1 &
      - name: Run local Action
        uses: ./
        with:
          target: http://127.0.0.1:4173
          health-url: http://127.0.0.1:4173/health
          cli-version: workspace
          install-browser: false
          upload-artifact: false
          upload-sarif: false
