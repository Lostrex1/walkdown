# Copy to walkdown.config.yaml and adjust for the application under test.
schemaVersion: 1
outputDir: .walkdown
timeoutMs: 30000
maxPages: 25
maxDepth: 3
include: []
exclude: []
allowedOrigins: []
viewports:
  - name: desktop
    width: 1440
    height: 900
  - name: mobile
    width: 390
    height: 844
browser:
  # Binary evidence cannot be redacted; enable only after reviewing its sensitivity.
  trace: false
  screenshot: false
  settleMs: 100
  maxArtifactBytes: 10000000
exploration:
  maxActions: 100
  crawlTimeoutMs: 60000
  maxQueryVariantsPerPath: 3
  allowExternalNavigation: false
baseline:
  path: baseline.json
  failOn: [error, blocking]
checks:
  placeholders: ["", "#", "javascript:void(0)", "javascript:;"]
  rules:
    navigation.placeholder-link:
      enabled: true
      severity: warning
    navigation.broken-internal-link:
      enabled: true
      severity: error
      ignoreUrlPatterns: []
    runtime.page-error:
      enabled: true
      severity: error
      ignoreMessagePatterns: []
    runtime.console-error:
      enabled: true
      severity: warning
      ignoreMessagePatterns: []
    runtime.failed-request:
      enabled: true
      severity: error
      ignoreMessagePatterns: []
      ignoreUrlPatterns: []
    interaction.dead-control:
      enabled: true
      severity: error
    interaction.pseudo-control:
      enabled: true
      severity: warning
    responsive.horizontal-overflow:
      enabled: true
      severity: error
    interaction.obstructed-control:
      enabled: true
      severity: error
    accessibility.missing-name:
      enabled: true
      severity: warning
    accessibility.keyboard-focus:
      enabled: true
      severity: warning
    accessibility.modal-focus:
      enabled: true
      severity: error
  interaction:
    allowButtonClicks: false
    effectTimeoutMs: 500
    stabilityMs: 100
    layoutSettleMs: 100
    maxControlsPerPage: 20
    keyboardMaxSteps: 50
    dynamicSelectors:
      - "[data-walkdown-dynamic]"
      - "[data-walkdown-volatile]"
    ignoreRequestPatterns:
      - "*/analytics*"
      - "*/collect*"
      - "*google-analytics.com*"
      - "*/poll*"
      - "*/heartbeat*"
