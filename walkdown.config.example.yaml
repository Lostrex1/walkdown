# Copy to walkdown.config.yaml and adjust for the application under test.
schemaVersion: 1
outputDir: .walkdown
timeoutMs: 30000
maxPages: 25
maxDepth: 3
include: []
exclude: []
allowedOrigins: []
viewports:
  - name: desktop
    width: 1440
    height: 900
browser:
  trace: true
  settleMs: 100
  maxArtifactBytes: 10000000
exploration:
  maxActions: 100
  crawlTimeoutMs: 60000
  maxQueryVariantsPerPath: 3
  allowExternalNavigation: false
checks:
  placeholders: ["", "#", "javascript:void(0)", "javascript:;"]
  rules:
    navigation.placeholder-link:
      enabled: true
      severity: warning
    navigation.broken-internal-link:
      enabled: true
      severity: error
      ignoreUrlPatterns: []
    runtime.page-error:
      enabled: true
      severity: error
      ignoreMessagePatterns: []
    runtime.console-error:
      enabled: true
      severity: warning
      ignoreMessagePatterns: []
    runtime.failed-request:
      enabled: true
      severity: error
      ignoreMessagePatterns: []
      ignoreUrlPatterns: []
